<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RouteShepherd — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8faf8;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 480px;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #1B5E20, #2E7D32);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(27, 94, 32, 0.3);
    }
    .logo svg {
      width: 40px;
      height: 40px;
      fill: white;
    }
    .icon-offline {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      color: #1B5E20;
    }
    h1 {
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1B5E20;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 32px;
      background: #1B5E20;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .retry-btn:hover {
      background: #2E7D32;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(27, 94, 32, 0.3);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .features {
      margin-top: 32px;
      padding: 20px;
      background: white;
      border-radius: 16px;
      border: 1px solid #e5e5e5;
    }
    .features h3 {
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #1B5E20;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .features ul {
      list-style: none;
      text-align: left;
    }
    .features li {
      padding: 8px 0;
      font-size: 14px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .features li::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #F9A825;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
    </div>

    <svg class="icon-offline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>

    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      RouteShepherd needs a connection to show live bus tracking and coordination data.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Try Again
    </button>

    <div class="features">
      <h3>Available Offline</h3>
      <ul>
        <li>Previously viewed routes & pickup points</li>
        <li>Basic app interface & navigation</li>
        <li>Your last session information</li>
      </ul>
    </div>
  </div>
</body>
</html>
